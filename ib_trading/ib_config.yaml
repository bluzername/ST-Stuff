connection:
  host: "127.0.0.1"
  port: 7497  # TWS paper trading (7496 for live)
  client_id: 1
  account: ""  # Leave empty for default account
  timeout: 10

execution:
  mode: "paper"  # paper or live
  max_order_value: 10000
  require_confirmation: true
  order_timeout: 60  # seconds to wait for fill
  
monitoring:
  data_directories:
    - "../Start Your Own"
    - "../Scripts and CSV Files"  
  poll_interval: 60  # seconds between CSV checks
  
logging:
  execution_csv: "ib_execution_log.csv"
  checkpoint_file: ".ib_checkpoint.json"
  verbose: true
  
safety:
  max_daily_trades: 50
  min_price: 0.01
  max_price: 1000
  max_quantity: 10000
  allowed_order_types: ["MKT", "LMT"]